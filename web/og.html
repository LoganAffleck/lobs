<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LOBS social card</title>
    <!-- The link preview card (public/og.png), rendered by scripts/og.mjs at 1200x630. -->
    <script type="module">import '@fontsource-variable/inter'; document.fonts.ready.then(() => (window.__ogReady = true))</script>
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background:
          radial-gradient(620px 420px at 78% 18%, rgba(196, 140, 255, 0.34), transparent 70%),
          radial-gradient(520px 360px at 96% 92%, rgba(255, 94, 196, 0.20), transparent 70%),
          radial-gradient(700px 500px at 0% 100%, rgba(108, 40, 204, 0.22), transparent 70%),
          #111111;
        color: #f2f2f2;
        font-family: 'Inter Variable', Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
      .brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
      .brand img { width: 44px; height: 44px; }
      h1 { margin: 34px 0 0; font-size: 84px; line-height: 1; letter-spacing: -0.04em; font-weight: 760; white-space: nowrap; }
      .badge {
        display: inline-block; margin-left: 4px; padding: 5px 12px; border-radius: 999px;
        border: 1.5px solid rgba(196, 140, 255, 0.5); background: rgba(108, 40, 204, 0.32); color: #c48cff;
        font-size: 15px; letter-spacing: 0.08em; font-weight: 650; text-transform: uppercase;
      }
      p { margin: 26px 0 0; font-size: 31px; line-height: 1.3; color: #c9c9c9; letter-spacing: -0.01em; max-width: 500px; }
      .facts { margin-top: 40px; display: flex; gap: 12px; font-size: 18px; color: #a1a1a1; }
      .facts span { padding: 7px 14px; border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 999px; background: rgba(255, 255, 255, 0.03); }
      .shot {
        position: absolute; left: 640px; top: 96px; width: 820px; border-radius: 16px; overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 8px rgba(255, 255, 255, 0.03);
        transform: perspective(1600px) rotateY(-9deg) rotateX(3deg); transform-origin: left center;
      }
      .shot img { display: block; width: 100%; }
    </style>
  </head>
  <body>
    <div class="shot"><img src="/shots/editor.png" alt="" /></div>
    <div class="copy">
      <div class="brand"><img src="/brand/lobs-gem-256.png" alt="" />LOBS<span class="badge">Beta</span></div>
      <h1>Logan's OBS</h1>
      <p>OBS with a creative UI for building awesome scenes.</p>
      <div class="facts"><span>Free</span><span>Open source</span><span>Windows</span></div>
    </div>
  </body>
</html>
